[package]
name = "pgpad-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
pgpad-core = { path = "../pgpad-core" }
rmcp = { version = "1.7.0", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
uuid = "1.0"
